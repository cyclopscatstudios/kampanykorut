name: Auto create draft PR from feature branches

on:
  push:
    branches:
      - 'feature-*'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create draft PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${{ github.ref_name }}" \
            --title "WIP: ${{ github.ref_name }}" \
            --draft \
            --body "🤖 Automatically created draft PR"
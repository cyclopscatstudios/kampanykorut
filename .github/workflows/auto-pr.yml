name: Auto create draft PR from feature branches

on:
  push:
    branches:
      - "feature_*"

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check if PR already exists
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh pr list \
            --head "${{ github.ref_name }}" \
            --base dev \
            --json number \
            --jq 'length')

          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Create draft PR
        if: steps.check_pr.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base dev \
            --head "${{ github.ref_name }}" \
            --title "WIP: ${{ github.ref_name }}" \
            --draft \
            --body "🤖 Automatically created draft PR"

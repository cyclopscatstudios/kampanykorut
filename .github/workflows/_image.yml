name: Build image

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      version:
        type: string
        required: true
      tags:
        type: string
        required: true
      environment:
        type: string
        default: production
      push:
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IMAGE: ${{ inputs.app == 'campaign-api' && format('ghcr.io/{0}/campaign-api', github.repository) || format('ghcr.io/{0}', github.repository) }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          {
            echo "tags<<EOF"
            for tag in $TAGS; do echo "$IMAGE:$tag"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.app == 'campaign-api' && 'apps/campaign-api/Dockerfile' || 'Dockerfile' }}
          push: ${{ inputs.push }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            APP_VERSION=${{ inputs.version }}
            GIT_COMMIT=${{ github.sha }}
            VITE_ENVIRONMENT=${{ inputs.environment }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_POSTHOG_KEY=${{ secrets.VITE_POSTHOG_KEY }}
            VITE_POSTHOG_HOST=${{ secrets.VITE_POSTHOG_HOST }}
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}

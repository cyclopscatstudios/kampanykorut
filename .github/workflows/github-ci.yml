name: Kampánykörút CI

on:
  push:
    branches: ["*"]
    paths-ignore:
      - "apps/campaign-api/**"
      - ".github/workflows/campaign-api.yml"
  pull_request:
    paths-ignore:
      - "apps/campaign-api/**"
      - ".github/workflows/campaign-api.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Build
        run: yarn workspace kampanykorut build

      - name: Tests
        run: yarn test -- --coverage

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "true"
      PLAYWRIGHT: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - run: corepack enable

      - run: yarn install --frozen-lockfile

      - run: npx playwright install --with-deps

      - run: npx playwright install chromium --with-deps

      - run: yarn playwright

      - name: Upload Playwright Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/

  component-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - run: corepack enable

      - run: yarn install --frozen-lockfile

      - run: npx playwright install --with-deps

      - run: yarn test-ct

      - name: Upload Playwright CT Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ct-artifacts
          path: |
            apps/kampanykorut/playwright-report/
            apps/kampanykorut/test-results/

  docker:
    needs:
      - build
      - e2e
      - component-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_image.yml
    secrets: inherit
    with:
      app: kampanykorut
      version: dev-${{ github.sha }}
      environment: dev
      tags: |
        dev
        dev-${{ github.sha }}

  deploy:
    needs: docker
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      service: kampanykorut-dev
      version-var: KAMPANYKORUT_DEV_VERSION
      version: dev-${{ github.sha }}

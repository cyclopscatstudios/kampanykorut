name: Kampánykörút CI

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn workspace kampanykorut lint
        continue-on-error: true

      - name: Format check
        run: yarn workspace kampanykorut format:check
        continue-on-error: true

      - name: Build
        run: yarn workspace kampanykorut build

      - name: Tests
        run: yarn workspace kampanykorut test -- --coverage

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "true"
      PLAYWRIGHT: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - run: corepack enable

      - run: yarn install --frozen-lockfile

      - run: npx playwright install --with-deps

      - run: npx playwright install chromium --with-deps

      - run: yarn workspace kampanykorut playwright

      - name: Upload Playwright Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/kampanykorut/playwright-report/
            apps/kampanykorut/test-results/

  component-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - run: corepack enable

      - run: yarn install --frozen-lockfile

      - run: npx playwright install --with-deps

      - run: yarn workspace kampanykorut test-ct

      - name: Upload Playwright CT Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ct-artifacts
          path: |
            apps/kampanykorut/playwright-report/
            apps/kampanykorut/test-results/

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            GIT_COMMIT=${{ github.sha }}

name: Campaign API CI

on:
  push:
    branches: ["*"]
    paths:
      - "apps/campaign-api/**"
      - "shared/**"
      - "package.json"
      - "yarn.lock"
      - "eslint.config.js"
      - ".github/workflows/campaign-api.yml"
  pull_request:
    paths:
      - "apps/campaign-api/**"
      - "shared/**"
      - "package.json"
      - "yarn.lock"
      - "eslint.config.js"
      - ".github/workflows/campaign-api.yml"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: corepack enable

      - run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn eslint apps/campaign-api

      - name: Format check
        run: yarn prettier --check apps/campaign-api

      - name: Typecheck
        run: yarn workspace campaign-api typecheck

      - name: Tests
        run: yarn workspace campaign-api test

      - name: Build
        run: yarn workspace campaign-api build

  docker:
    runs-on: ubuntu-latest
    needs: check

    permissions:
      contents: read
      packages: write

    env:
      PUSH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev') }}
      IMAGE: ghcr.io/${{ github.repository }}/campaign-api

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "tags=$IMAGE:latest,$IMAGE:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:dev,$IMAGE:dev-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/campaign-api/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=campaign-api
          cache-to: type=gha,mode=max,scope=campaign-api

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')

    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cd /opt/kampanykorut && docker compose pull && docker compose up -d'

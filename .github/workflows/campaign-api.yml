name: Campaign API CI

on:
  push:
    branches: ["*"]
    paths:
      - "apps/campaign-api/**"
      - "shared/**"
      - "package.json"
      - "yarn.lock"
      - "eslint.config.js"
      - ".github/workflows/campaign-api.yml"
  pull_request:
    paths:
      - "apps/campaign-api/**"
      - "shared/**"
      - "package.json"
      - "yarn.lock"
      - "eslint.config.js"
      - ".github/workflows/campaign-api.yml"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: corepack enable

      - run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn eslint apps/campaign-api

      - name: Format check
        run: yarn prettier --check apps/campaign-api

      - name: Typecheck
        run: yarn workspace campaign-api typecheck

      - name: Tests
        run: yarn workspace campaign-api test

      - name: Build
        run: yarn workspace campaign-api build

  docker:
    needs: check
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_image.yml
    secrets: inherit
    with:
      app: campaign-api
      version: dev-${{ github.sha }}
      environment: dev
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
      tags: |
        dev
        dev-${{ github.sha }}

  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      service: campaign-api-dev
      version-var: CAMPAIGN_API_DEV_VERSION
      version: dev-${{ github.sha }}

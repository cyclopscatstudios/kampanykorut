      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"></stop>
      <stop offset="1" stop-color="#000000" stop-opacity="0.15"></stop>
    </linearGradient>
  </defs>
  
  <g transform="translate(92 0) scale(1.5)">

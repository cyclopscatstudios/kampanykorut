  <text x="140" y="152" text-anchor="middle" font-family="Montserrat, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="700" font-size="9" letter-spacing="2.4" fill="#cbd5e1">POLITIKAI STRATÉGIA JÁTÉK</text>
